use_default_settings: true

general:
  instance_name: "Hackathon Hunter SearXNG"
  contact_url: false
  enable_metrics: false

server:
  # Replace this value before exposing SearXNG to the public internet.
  secret_key: "hackathon-hunter-local-searxng-secret-change-in-production"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
