# Hackathon Hunter — self-hosted stack for Docker Compose and Coolify.
#
# Coolify: create a resource → "Docker Compose" → point at this repository.
# Set these environment variables on the Coolify resource before deploying:
#   APP_API_KEY            long random string (frontend is baked with it → rebuild after changing)
#   NEXT_PUBLIC_API_URL    public URL of the backend,  e.g. https://hunter-api.example.com
#   NEXT_PUBLIC_APP_API_KEY  same value as APP_API_KEY (Coolify: set both)
#   FRONTEND_ORIGINS       public URL of the frontend, e.g. https://hunter.example.com
#   DASHBOARD_URL          public URL of the frontend (used in digest emails)
#   POSTGRES_PASSWORD      strong database password
#   RESEND_API_KEY / EMAIL_FROM / EMAIL_TO   optional; can also be saved in the Settings UI
# All host ports are optional overrides (BACKEND_PORT, FRONTEND_PORT,
# POSTGRES_PORT, SEARXNG_PORT). Postgres only binds to 127.0.0.1.

name: hackathon-hunter

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon_hunter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hackathon_hunter}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8081/}
      SEARXNG_LIMITER: "false"
    ports:
      - "${SEARXNG_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Optional: Coolify deployments usually have no .env in the repository.
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackathon_hunter}
      SEARXNG_URL: http://searxng:8080
      SETTINGS_FILE: /app/data/settings.json
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      AUTO_SEND_EMAIL: ${AUTO_SEND_EMAIL:-true}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 0 8 * * *}
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Baked at build time (NEXT_PUBLIC_*). Changing them requires a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_API_KEY: ${APP_API_KEY:-change-me}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_data:
